name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-next-quality
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify runtime identity
        shell: bash
        run: |
          set -euo pipefail
          expected_node="$(tr -d '\r\n' < .nvmrc)"
          actual_node="$(node --version)"
          expected_npm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual_npm="$(npm --version)"
          printf 'node=%s\n' "$actual_node"
          printf 'npm=%s\n' "$actual_npm"
          printf 'sha=%s\n' "$GITHUB_SHA"
          test "$actual_node" = "$expected_node"
          test "$actual_npm" = "$expected_npm"

      - name: Install from lockfile
        run: npm ci

      - name: Blocking read-only quality contract
        id: quality
        run: npm run quality

      - name: B2 production runtime and i18n contract
        id: b2
        run: npm run test:b2:runtime

      - name: B3 deterministic SWAPI client contract
        id: b3_client
        run: npm run test:b3:swapi

      - name: B3 production SWAPI route contract
        id: b3_runtime
        run: npm run test:b3:runtime

      - name: B4 deterministic route/data contract
        id: b4_data
        run: npm run test:b4:data

      - name: B4 production route/data contract
        id: b4_runtime
        run: npm run test:b4:runtime

      - name: Production audit debt inventory
        id: audit
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Write quality evidence
        if: always()
        shell: bash
        run: |
          {
            echo "# Quality evidence"
            echo "- SHA: $GITHUB_SHA"
            echo "- Node: $(node --version 2>/dev/null || echo unavailable)"
            echo "- npm: $(npm --version 2>/dev/null || echo unavailable)"
            echo "- quality: ${{ steps.quality.outcome }}"
            echo "- B2 runtime/i18n: ${{ steps.b2.outcome }}"
            echo "- B3 SWAPI client: ${{ steps.b3_client.outcome }}"
            echo "- B3 SWAPI runtime: ${{ steps.b3_runtime.outcome }}"
            echo "- B4 route/data unit: ${{ steps.b4_data.outcome }}"
            echo "- B4 route/data runtime: ${{ steps.b4_runtime.outcome }}"
            echo "- production audit debt: ${{ steps.audit.outcome }}"
            echo "- lint ceiling: 0 errors / 15 warnings"
            echo "- format ceiling: 34 files"
          } | tee quality-summary.md
          cat quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: quality-summary.md
